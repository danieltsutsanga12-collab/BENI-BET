<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="theme-color" content="#22c55e">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENI-BET GOMA - 1200 MATCHS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f172a;color:white}
.header{background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px}
.logo span{color:#22c55e}
.solde{background:#22c55e;color:#000;padding:6px 14px;border-radius:20px;font-weight:bold}
.banner{background:linear-gradient(90deg,#22c55e,#16a34a);padding:10px;text-align:center;font-weight:bold}
.match{background:#1e293b;margin:8px;border-radius:10px;padding:12px}
.match-top{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:8px}
.teams{font-weight:bold;margin-bottom:10px}
.cotes{display:flex;gap:8px}
.cote{flex:1;background:#334155;padding:10px;border-radius:8px;text-align:center;cursor:pointer}
.install{background:#f59e0b;color:#000;padding:12px;text-align:center;font-weight:bold;margin:8px;border-radius:10px}
</style>
</head>
<body>
<div class="header"><div class="logo">BENI-<span>BET</span> GOMA</div><div class="solde">5,000 CDF</div></div>
<div class="banner">⚽ 1200 MATCHS - GOMA / BENI / BUKAVU ⚽</div>
<div class="install">📲 APP BENI-BET - INSTALLÉE AVEC ICÔNE</div>
<div id="matches"></div>
<script>
const teams=[["Arsenal","Bayern"],["Vita Club","Barcelona"],["AC Milan","Arsenal"],["Raja","TP Mazembe"],["Real Madrid","Man City"],["PSG","Inter"]];
const container=document.getElementById('matches');
for(let i=1;i<=1200;i++){
  const t=teams[i%teams.length];
  container.innerHTML+=`<div class="match"><div class="match-top"><span>Match #${i}</span><span>LIVE</span></div><div class="teams">${t[0]} vs ${t[1]}</div><div class="cotes"><div class="cote">1<br><b>${(Math.random()*2+1.2).toFixed(2)}</b></div><div class="cote">X<br><b>${(Math.random()*2+2).toFixed(2)}</b></div><div class="cote">2<br><b>${(Math.random()*1.5+1.5).toFixed(2)}</b></div></div></div>`;
}
</script>
</body>
</html>
